# Parameters for fast_grid_mesh_node.
# triangle_pixel_size: 4 matches the legacy OrganizedFastMesh call.
# PCL stores the step as max(1, pixel_size - 1), so 4 walks the grid with stride 3.
# Set grid_stride to a positive pixel step (1, 2, 4, 8, ...) to override that mapping.
/**:
  ros__parameters:
    backend: cpu
    input_topic: /points/xyzrgba
    output_topic: /object_mesh/vertices
    plane_topic: /unity/clipping_plane
    triangle_pixel_size: 4
    grid_stride: 0
    distance_threshold: 0.01
    invert_plane_normal: false
    angle_tolerance_deg: 12.5
    max_edge_length_a: 0.0
    max_edge_length_b: 0.0
    max_edge_length_c: 0.0
    use_depth_as_distance: false
    store_shadowed_faces: false
    viewpoint_x: 0.0
    viewpoint_y: 0.0
    viewpoint_z: 0.0
    openmp_threads: 0
    log_every_n: 1
